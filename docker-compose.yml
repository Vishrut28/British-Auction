services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq
    # Host port 5433 so it does not clash with a Postgres already on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
